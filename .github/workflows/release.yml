name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # build-app.sh reads the version from the tag

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version || true

      - name: Build universal app
        run: bash Scripts/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FanManager
          path: |
            build/*.zip
            build/*.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.zip
            build/*.sha256
          body: |
            Download the zip, unzip it, and drag **Fan Manager.app** anywhere you like.

            Because this build is ad-hoc signed rather than notarized, macOS will
            refuse to open it until you clear the quarantine flag:

            ```
            xattr -dr com.apple.quarantine "/Applications/Fan Manager.app"
            ```

            Or install it in one command:

            ```
            curl -fsSL https://raw.githubusercontent.com/emhasala/macos-fan-manager/main/install.sh | bash
            ```

            Monitoring works immediately. Fan control needs one extra command,
            which the app shows you.
